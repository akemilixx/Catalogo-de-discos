<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastrar Quero</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main>
    <h1>Cadastrar vinil que quero</h1>
    <p class="sub">Lista de desejos: o que você quer comprar.</p>
    <div class="layout-cad">
      <form id="form" class="form painel" autocomplete="off">
        <h2 id="titulo-form">Novo disco</h2>
        <div class="linha">
          <label>Artista/banda<input name="artista" list="dl-artistas" required></label>
          <label>Gênero<input name="genero" list="dl-generos"></label>
        </div>
        <label>Álbum<input name="album" required></label>
        <div>
          <label style="margin-bottom:4px">Capa</label>
          <div class="foto-campo">
            <div class="prev" id="foto-prev"></div>
            <div class="ops">
              <input type="file" id="foto-arquivo" accept="image/*">
              <input type="url" id="foto-url" placeholder="…ou cole o link de uma imagem">
              <span class="ajuda">Dica: copie uma imagem e cole aqui com Ctrl+V.</span>
              <div class="acoes" style="justify-content:flex-start">
                <button type="button" id="foto-google">Buscar no Google Imagens</button>
                <button type="button" id="foto-remover">Remover</button>
              </div>
            </div>
          </div>
        </div>
        <div class="linha">
          <label>Lançamento do vinil<input name="lancamento" type="number" min="1900" max="2100" inputmode="numeric"></label>
          <label>Nacionalidade<input name="nacionalidade" list="dl-paises"></label>
        </div>
        <label>Lojas<input name="lojas" list="dl-lojas"></label>
        <div class="linha">
          <label>Preço <small>(número ou texto, ex.: Indisponível)</small><input name="preco" list="dl-precos" placeholder="349,90"></label>
          <label>Data última atualização<input name="atualizacao" type="date"></label>
        </div>
        <div class="linha">
          <label>Núm.<input name="num" type="number" min="1"></label>
          <label>Link Google Images <small>(automático se vazio)</small><input name="linkImagens" type="url" pattern="https?://.+" title="O link precisa começar com http:// ou https://"></label>
        </div>
        <div class="acoes">
          <button type="button" id="cancelar" hidden>Cancelar</button>
          <button type="submit" class="pri">Salvar</button>
        </div>
      </form>

      <section>
        <div class="barra">
          <h2 style="margin:0">Quero <span id="total"></span></h2>
          <input type="search" id="filtro" placeholder="Filtrar…" style="flex:1 1 180px">
        </div>
        <div class="lista" id="lista"></div>
      </section>
    </div>
  </main>
  <datalist id="dl-artistas"></datalist><datalist id="dl-generos"></datalist><datalist id="dl-paises"></datalist><datalist id="dl-lojas"></datalist>
  <datalist id="dl-precos"><option value="Indisponível"><option value="Desconhecido"></datalist>
  <script type="module" src="assets/quero.js"></script>
</body>
</html>
